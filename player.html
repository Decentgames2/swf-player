<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flash Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <style>
        body {
            background-color: #1a1c22;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #flash-container {
            /* 根据视口宽高自适应，保持 4:3 宽高比 */
            width: min(95vw, calc(95vh * 4 / 3));
            height: min(95vh, calc(95vw * 3 / 4));
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #flash-container > ruffle-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script>
        // 必须在加载 ruffle.js 之前配置
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowScriptAccess: true,
            backgroundColor: "#1a1c22",
            unmuteOverlay: "hidden",
            autoPlay: "auto",
            warnOnUnsupportedContent: false,
            logLevel: "error",
            publicPath: "./ruffle-web/",
            maxExecutionDuration: 60,
            letterbox: "fullscreen",
            upgradeToHttps: false,
            contextMenu: "on",
            showSwfDownload: false,
            polyfills: false
        };
    </script>
    <script src="./ruffle-web/ruffle.js"></script>
    <div id="flash-container"></div>
    <script>
        // 预定义全局对象，防止游戏访问未定义的属性
        // 必须在加载游戏之前定义
        window.kongregate_services = {
            stats: {
                submit: function(name, value) {
                    console.log('[Mock Stats] Submitted:', name, '=', value);
                },
                request: function(callback) {
                    if (typeof callback === 'function') {
                        callback({});
                    }
                },
                reset: function() {
                    console.log('[Mock Stats] Reset');
                }
            },
            achievements: {
                register: function(id, name, description) {
                    console.log('[Mock Achievements] Registered:', id, name);
                },
                unlock: function(id) {
                    console.log('[Mock Achievements] Unlocked:', id);
                },
                list: function(callback) {
                    if (typeof callback === 'function') {
                        callback([]);
                    }
                }
            },
            leaderboards: {
                postScore: function(id, score, callback) {
                    console.log('[Mock Leaderboard] Posted score:', id, score);
                    if (typeof callback === 'function') {
                        callback(true);
                    }
                },
                getScores: function(id, callback) {
                    console.log('[Mock Leaderboard] Getting scores for:', id);
                    if (typeof callback === 'function') {
                        callback([]);
                    }
                }
            },
            chat: {
                addListener: function(event, callback) {},
                removeListener: function(event, callback) {},
                sendMessage: function(msg) {}
            },
            gameInputs: {
                getMouseX: function() { return 0; },
                getMouseY: function() { return 0; },
                getMouseDown: function() { return false; }
            },
            marketplace: {
                getInventory: function(callback) {
                    if (typeof callback === 'function') {
                        callback([]);
                    }
                },
                purchaseItem: function(id, callback) {
                    if (typeof callback === 'function') {
                        callback(false);
                    }
                }
            },
            metrics: {
                submitStats: function(stats) {
                    console.log('[Mock Metrics] Stats submitted:', stats);
                }
            }
        };

        // 完整的 Kongregate API 对象
        window.kongregate = {
            services: window.kongregate_services,
            getState: function() {
                return {
                    username: 'Player',
                    userId: 0,
                    gameAuthToken: '',
                    isGuest: true
                };
            },
            isGuest: function() {
                return true;
            },
            getGameAuthToken: function() {
                return '';
            }
        };

        window.KongregateAPI = window.kongregate;

        console.log('✅ Kongregate API mock objects initialized');

        // 注册 Service Worker 来拦截外部请求
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./worker.js')
                .then(registration => {
                    console.log('✅ Service Worker registered successfully');
                    console.log('Scope:', registration.scope);
                })
                .catch(error => {
                    console.warn('⚠️ Service Worker registration failed (non-critical):', error.message);
                });
        } else {
            console.warn('⚠️ Service Worker is not supported in this browser');
        }

        function getGameFromUrl() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const game = urlParams.get('game');
                if (game) return game;
            } catch (e) {
                console.log('URLSearchParams not supported');
            }
            const queryString = window.location.search.substring(1);
            const params = queryString.split('&');
            for (let i = 0; i < params.length; i++) {
                const pair = params[i].split('=');
                if (decodeURIComponent(pair[0]) === 'game') {
                    return decodeURIComponent(pair[1] || '');
                }
            }
            return 'game1.swf';
        }

        function initPlayer() {
            // ruffle.js 加载后，window.RufflePlayer 已被替换为 SourceAPI 实例
            if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== 'function') {
                console.error('❌ Ruffle API not ready. window.RufflePlayer.newest is not available.');
                return;
            }

            const ruffle = window.RufflePlayer.newest();
            if (!ruffle) {
                console.error('❌ No Ruffle source registered.');
                return;
            }

            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            const gameName = getGameFromUrl();
            const gamePath = `./game/${gameName}`;

            console.log('Loading game:', gamePath);

            player.load(gamePath).then(() => {
                console.log('✅ Game loaded successfully');
                ensureKongregateAPI();
            }).catch(err => {
                console.error('❌ Failed to load game:', err);
            });
        }

        // 确保 Kongregate API 存在
        function ensureKongregateAPI() {
            if (!window.kongregate || !window.kongregate.services) {
                console.warn('⚠️ Kongregate API missing, re-injecting...');
                window.kongregate = {
                    services: window.kongregate_services || {},
                    getState: function() {
                        return { username: 'Player', userId: 0, gameAuthToken: '' };
                    },
                    isGuest: function() { return true; }
                };
                window.KongregateAPI = window.kongregate;
            }
            console.log('✅ Kongregate API verified');
        }

        // 等待页面完全加载后再初始化播放器（确保 ruffle.js 的 SourceAPI 已注册）
        window.addEventListener('load', () => {
            setTimeout(initPlayer, 100);
        });
    </script>
</body>
</html>
